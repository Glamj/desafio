<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel='stylesheet'
        href='https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-thin-rounded/css/uicons-thin-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-thin-rounded/css/uicons-thin-rounded.css'>
    <link rel='stylesheet'
        href='https://cdn-uicons.flaticon.com/4.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>
    <link rel="stylesheet" href="/style/var.css">
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="reset.css">
    <title></title>
</head>

<body>
    <header>

        <div class="header-Top">
            <div class="logo"><img src="/src/Logo Vyron.png" alt=""></div>
            <div class="input-Search">
                <input type="search" id="searchInput" placeholder="Busque na Vyron">
                <div class="icon">
                    <i class="fi fi-rr-search"></i>
                </div>

            </div>
            <div class="header-Top-end">
                <div class="login-btn">
                    <p>
                        <a href="#">Entre</a> ou <br>
                        <a href="#">cadastre-se</a>
                    </p>
                </div>
                <div class="box">
                    <div title="Suporte" class="icon">
                        <i class="fi fi-tr-customer-service"></i>
                    </div>
                    <div title="Acessibilidade" class="icon">
                        <i class="fi fi-tr-universal-access"></i>
                    </div>
                    <div title="Favoritos" class="icon">
                        <i class="fi fi-tr-heart"></i>
                    </div>
                    <div title="Carrinho" class="icon">
                        <i class="fi fi-tr-cart-minus"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="menu">
            <ul>
                <li class="dropDown">
                    <a class="dropDown-categorias" href="">Categorias</a>
                    <div class="dropDown-menu">
                        <a href="">produto 1</a>
                        <a href="">produto 2</a>
                        <a href="">produto 3</a>
                    </div>
                </li>
                <li>
                    <a class="btn-default" href="">mais vendidos</a>
                </li>

            </ul>

        </div>

    </header>

    <main>


        <div id="banners">
            <img src="/src/banners/Banner.gif" alt="Banner Principal" id="imgbanner">
        </div>


        <section class="container-slider">
            <button id="previous-button"><i class="fi fi-sr-angle-left"></i></button>

            <div class="slider-wrapper" id="slider-wrapper">
                <div class="container-imgs">
                    <img src="/src/iconsCategorias/favoritos.png" alt="Controle">
                    <h2>favoritos</h2>
                </div>
                <div class="container-imgs">
                    <img src="/src/iconsCategorias/celular.png" alt="Celular">
                    <h2>celular</h2>
                </div>
                <div class="container-imgs">
                    <img src="/src/iconsCategorias/computador.png" alt="Computador">
                    <h2>computador</h2>
                </div>
                <div class="container-imgs">
                    <img src="/src/iconsCategorias/controle.png" alt="Controle">
                    <h2>controle</h2>
                </div>
                <div class="container-imgs">
                    <img src="/src/iconsCategorias/jogos.png" alt="Controle">
                    <h2>jogos</h2>
                </div>
                <div class="container-imgs">
                    <img src="/src/iconsCategorias/mouse.png" alt="Controle">
                    <h2>mouse</h2>
                </div>
                <div class="container-imgs">
                    <img src="/src/iconsCategorias/notebook.png" alt="Controle">
                    <h2>notebook</h2>
                </div>
                <div class="container-imgs">
                    <img src="/src/iconsCategorias/placaDeVideo.png" alt="Controle">
                    <h2>placa de vídeo</h2>
                </div>
                <div class="container-imgs">
                    <img src="/src/iconsCategorias/processador.png" alt="Controle">
                    <h2>processador</h2>
                </div>
                <div class="container-imgs">
                    <img src="/src/iconsCategorias/teclado.png" alt="Controle">
                    <h2>teclado</h2>
                </div>
            </div>

            <button id="next-button"><i class="fi fi-sr-angle-right"></i></button>
        </section>
    </main>
    <script src="/src/funçoes/carrosel.js"></script>
</body>
</html>
