<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-thin-rounded/css/uicons-thin-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-thin-rounded/css/uicons-thin-rounded.css'>
    <link rel="stylesheet" href="style/var.css">
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="reset.css">
    <title></title>
</head>
<body>
    <header>

        <div class="header-Top">
            <div class="logo"><img src="src/Logo Vyron.png" alt=""></div>
            <div class="input-Search">
                <input type="search" id="searchInput" placeholder="Busque na Vyron">
                <div class="icon">
                    <i class="fi fi-rr-search"></i>
                </div>
                
            </div>
            <div class="header-Top-end">
                <div class="login-btn">
                    <p>
                        <button class='btn-clear btn-link' onclick="showCreateUserAccount('login')">Entre</button> ou <br>
                        <button class='btn-clear btn-link' onclick="showCreateUserAccount('register')">cadastre-se</button>
                    </p>
                </div>
                <div class="box">
                    <div title="Suporte" class="icon">
                        <i class="fi fi-tr-customer-service"></i>
                    </div>
                    <div title="Acessibilidade" class="icon">
                        <i class="fi fi-tr-universal-access"></i>
                    </div>
                    <div title="Favoritos" class="icon">
                        <i class="fi fi-tr-heart"></i>
                    </div>
                    <div title="Carrinho" class="icon">
                        <i class="fi fi-tr-cart-minus"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="menu">
            <ul>
                <li class="dropDown">
                    <a class="dropDown-categorias" href="">Categorias</a>
                    <div class="dropDown-menu">
                        <a href="">produto 1</a>
                        <a href="">produto 2</a>
                        <a href="">produto 3</a>
                    </div>
                </li>
                <li>
                    <a class="btn-default" href="">mais vendidos</a>
                </li>
                
            </ul>

        </div>

    </header>

    <main>

        <div class="carosel">
            <div class="group">
                <div class="card">
                    <img src="src/iconsCategorias/PC.png" alt="">
                    <h2>Computadores</h2>
                </div>
                <div class="card">
                    <img src="src/iconsCategorias/Teclado.png" alt="">
                    <h2>Teclado</h2>
                </div>
                <div class="card">
                    <img src="src/iconsCategorias/Mouse.png" alt="">
                    <h2>Mouse</h2>
                </div>
                <div class="card">
                    <img src="src/iconsCategorias/Notebook.png" alt="">
                    <h2>Notebook</h2>
                </div>
                <div class="card">
                    <img src="src/iconsCategorias/imgconsole.png" alt="">
                    <h2>Console</h2>
                </div>
                <div class="card">
                    <img src="src/iconsCategorias/Controle.png" alt="">
                    <h2>Controle</h2>
                </div>
                <div class="card">
                    <img src="src/iconsCategorias/Celular.png" alt="">
                    <h2>Celular</h2>
                </div>
                <div class="card">
                    <img src="src/iconsCategorias/imgplacadevideo2.png" alt="">
                    <h2>placa de vídeo</h2>
                </div>
                <div class="card">
                    <img src="src/iconsCategorias/Processador.png" alt="">
                    <h2>Processador</h2>
                </div>
                <div class="card">
                    <img src="src/iconsCategorias/MemoriaRam.png" alt="">
                    <h2>Memória Ram</h2>
                </div>
            </div>
        </div>

       <!-- <div id="BannerIMG">
            <img src="Banner.gif" alt="Banner Principal" id="imgbanner">
        </div>-->

            
        </section>
        
        <div id="overlayAccount" class="overlay invisible">
        
            <div class="overlayHeader">
                <h2>Acesse sua conta ou cadastre-se</h2>
                <button class="btn-clear overlayExit" style="--btn-color: black;" onclick="hideCreateUserAccount()">X</button>
            </div>

            <form class="form-login" id="form-login">

                <div class="form-field">
                    <div><p>Email:</p></div>
                    <input type="email" name="Email" placeholder="Email" id="email">
                </div>
                
                <div class="form-field">
                    <div><p>Senha:</p></div>
                    <input type="password" name="Password" placeholder="Senha" id="password">
                </div>
                
                <input type="button" class="btn-solid" value="Cadastrar">
                <input type="button" class="btn-outline" value="Login" onclick="goToRegister()">
            </form>

            <form action="" id="form-register" class="form-register invisible">

                <div class="form-field">
                    <div><p>Email:</p></div>
                    <input type="email" name="Email" placeholder="Email" id="email">
                </div>
                
                <div class="form-field">
                    <div><p>Senha:</p></div>
                    <input type="password" name="Password" placeholder="Senha" id="password">
                </div>

                <div class="form-field">
                    <div><p>Confirmar Senha:</p></div>
                    <input type="password" name="ConfirmPassword" placeholder="Confirmar Senha" id="password">
                </div>

                <input type="button" class="btn-solid" value="Login">
                <input type="button" class="btn-outline" value="Cadastrar" onclick="goToLogin()">
            </form>
         </div>
        <script src="script.js"></script>

    </main>
</body>
</html>
